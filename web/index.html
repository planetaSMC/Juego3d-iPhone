<!DOCTYPE html>
<html lang="es" class="ras-android">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RASMATIC · VR</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RASMATIC VR">
<meta name="application-name" content="RASMATIC VR">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f2a55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="mobile/android-controls.css">
<link rel="stylesheet" href="mobile/android-game.css">
<link rel="stylesheet" href="ios/ios.css">
<link rel="stylesheet" href="headtracking/head-tracking.css">
<link rel="stylesheet" href="vr/vr-preview.css">
<link rel="stylesheet" href="net/vr-link.css">
<link rel="stylesheet" href="v20/pharmacy.css">
<link rel="stylesheet" href="v21/v21.css">
</head>
<body>
<div id="v20-loading">Cargando RASMATIC VR…</div>
<button id="v20-mode" type="button" aria-label="Cambiar modo de cámara">RECORRIDO</button>
<button id="v20-routes" type="button" aria-label="Mostrar rutas">RUTAS</button>
<div id="v20-dock" role="toolbar" aria-label="Rutas de la farmacia">
  <button type="button" data-place="entrada">ENTRADA</button>
  <button type="button" data-place="estantes">ESTANTES</button>
  <button type="button" data-place="mostrador">MOSTRADOR</button>
  <button type="button" data-place="cinta">CINTA</button>
  <button type="button" data-place="maquina">MÁQUINA</button>
  <button type="button" data-place="aerea">AÉREA</button>
</div>

<script>
window.RASMATIC_GAME_MODE = true;
window.RasmaticApp = Object.freeze({
  id: 'v20',
  name: 'RASMATIC VR',
  shortName: 'RASMATIC VR',
  displayName: 'RASMATIC VR',
  headTracking: true,
  storagePrefix: 'rasmatic.',
  version: 'v21.2',
  phase: 'v21.2-polish'
});
document.documentElement.setAttribute('data-app', 'v20');
(function () {
  var prefix = 'rasmatic.';
  var base = 'rasmatic.';
  function mapKey(key) {
    key = String(key);
    if (prefix && key.indexOf(prefix) === 0) return key;
    if (prefix && key.indexOf(base) === 0) return prefix + key.slice(base.length);
    return prefix ? prefix + key : key;
  }
  window.RasmaticStore = {
    prefix: prefix,
    mapKey: mapKey,
    key: function (k) { return mapKey(k); },
    getItem: function (k) { try { return window.localStorage.getItem(mapKey(k)); } catch (e) { return null; } },
    setItem: function (k, v) { try { window.localStorage.setItem(mapKey(k), v); } catch (e) {} },
    removeItem: function (k) { try { window.localStorage.removeItem(mapKey(k)); } catch (e) {} }
  };
})();
</script>
<script src="three.min.js"></script>
<script src="v20/pharmacy-scene.js"></script>
<script src="v20/pharmacy-core.js"></script>
<script src="mobile/modes.js"></script>
<script src="mobile/platform.js"></script>
<script src="mobile/android-bridge.js"></script>
<script src="mobile/game.js"></script>
<script src="ios/ios-bridge.js"></script>
<script src="headtracking/head-tracking.js"></script>
<script src="vr/vr-preview.js"></script>
<script src="net/vr-link.js"></script>
<script>
(function () {
  var modeBtn = document.getElementById('v20-mode');
  var routesBtn = document.getElementById('v20-routes');
  var dock = document.getElementById('v20-dock');
  if (modeBtn) {
    modeBtn.addEventListener('click', function () {
      var core = window.RasmaticCore;
      if (!core) return;
      var m = core.getMode();
      core.setMode(m === 'place' ? 'film' : (m === 'film' ? 'model' : 'place'));
    });
  }
  if (routesBtn) {
    routesBtn.addEventListener('click', function () {
      if (window.RasmaticCore) window.RasmaticCore.toggleDock();
    });
  }
  if (dock) {
    dock.addEventListener('click', function (e) {
      var b = e.target.closest('[data-place]');
      if (!b || !window.RasmaticCore) return;
      window.RasmaticCore.gotoPlace(b.getAttribute('data-place'));
      window.RasmaticCore.setDock(false);
    });
  }
  window.addEventListener('load', function () {
    var load = document.getElementById('v20-loading');
    if (load) setTimeout(function () { load.classList.add('off'); }, 600);
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) &&
      !/[?&]embed=1\b/.test(location.search)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
