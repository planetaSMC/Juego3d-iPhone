name: iOS app V21 (RASMATIC VR)

# Compila la app Ãºnica RASMATIC VR en una Mac de la nube y deja el .ipa
# sin firmar como artefacto:
#   RASMATIC-VR-unsigned.ipa
#
#   1. SubÃ­ esta carpeta a GitHub.
#   2. Actions -> "iOS app V21 (RASMATIC VR)" -> Run workflow.
#   3. Descargar el artefacto "rasmatic-v21-ipa".
#   4. Instalar con AltStore/Sideloadly (docs/instalar-en-iphone.md).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Descargar el cÃ³digo
        uses: actions/checkout@v4

      - name: VersiÃ³n de Xcode
        run: xcodebuild -version

      - name: Comprobar estructura, target y permisos
        run: node tools/check-xcode.js

      - name: Compilar el .ipa sin firmar (esquema RasmaticVR)
        run: |
          chmod +x tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Verificar RASMATIC VR
        run: |
          node tools/verify-ipa.js dist/RASMATIC-VR-unsigned.ipa \
            --expect com.rasmatic.lugar3d --variant v20

      - name: Resumen
        run: |
          set -euo pipefail
          IPA=dist/RASMATIC-VR-unsigned.ipa
          echo "### RASMATIC VR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | Bundle ID | TamaÃ±o | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          size=$(wc -c < "$IPA" | tr -d ' ')
          hash=$(shasum -a 256 "$IPA" | cut -d' ' -f1)
          echo "| RASMATIC VR | \`com.rasmatic.lugar3d\` | $size B | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: rasmatic-v21-ipa
          path: dist/RASMATIC-VR-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

