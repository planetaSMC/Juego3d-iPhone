name: iOS apps V19 (dos .ipa sin firmar)

# Compila las DOS apps en una Mac de la nube y deja los .ipa como artefacto:
#   RASMATIC-HeadTracking-unsigned.ipa
#   RASMATIC-Classic-unsigned.ipa
#
#   1. Subí esta carpeta a un repositorio de GitHub (puede ser público).
#   2. Actions -> "iOS apps V19" -> Run workflow.
#   3. Descargar el artefacto "rasmatic-v19-ipas".
#   4. Instalar cada app con AltStore/Sideloadly (docs/instalar-en-iphone.md).
#
# Las dos apps tienen bundle ids distintos y se pueden instalar a la vez.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Comprobar estructura, targets y permisos
        run: node tools/check-xcode.js

      - name: Comprobar paridad del núcleo
        run: node tools/check-parity.js

      - name: Compilar los dos .ipa sin firmar
        run: |
          chmod +x tools/build-ipa.sh
          ./tools/build-ipa.sh

      - name: Verificar Head Tracking
        run: |
          node tools/verify-ipa.js dist/RASMATIC-HeadTracking-unsigned.ipa \
            --expect com.rasmatic.lugar3d.headtracking --variant headtracking

      - name: Verificar Classic
        run: |
          node tools/verify-ipa.js dist/RASMATIC-Classic-unsigned.ipa \
            --expect com.rasmatic.lugar3d.classic --variant classic

      - name: Resumen
        run: |
          set -euo pipefail
          echo "### Apps V19 generadas" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | Bundle ID | Tamaño | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for row in \
            "Head Tracking|com.rasmatic.lugar3d.headtracking|dist/RASMATIC-HeadTracking-unsigned.ipa" \
            "Classic|com.rasmatic.lugar3d.classic|dist/RASMATIC-Classic-unsigned.ipa"; do
            IFS='|' read -r app bundle ipa <<< "$row"
            size=$(wc -c < "$ipa" | tr -d ' ')
            hash=$(shasum -a 256 "$ipa" | cut -d' ' -f1)
            echo "| $app | \`$bundle\` | $size B | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Subir los dos .ipa
        uses: actions/upload-artifact@v4
        with:
          name: rasmatic-v19-ipas
          path: |
            dist/RASMATIC-HeadTracking-unsigned.ipa
            dist/RASMATIC-Classic-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
